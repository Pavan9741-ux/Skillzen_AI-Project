<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SkillZen AI Admin Panel - Manage companies and internships">
  <title>Admin Panel - SkillZen AI</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/glassmorphism.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">

  <style>
    .admin-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .login-card {
      max-width: 450px;
      width: 100%;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 2rem;
      margin-bottom: 3rem;
    }

    .stat-card {
      background: var(--glass-bg-primary);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 2rem;
      text-align: center;
    }

    .stat-number {
      font-size: 3rem;
      font-weight: 800;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 1rem 0;
    }

    .company-table {
      width: 100%;
      background: var(--glass-bg-primary);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .company-table th,
    .company-table td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid var(--glass-border);
    }

    .company-table th {
      background: var(--glass-bg-secondary);
      font-weight: 600;
      color: var(--text-primary);
    }

    .company-table tr:hover {
      background: var(--glass-bg-secondary);
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 2rem;
    }

    .modal-content {
      background: var(--glass-bg-primary);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 2rem;
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .action-btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      margin: 0 0.25rem;
    }

    .action-btn.edit {
      background: rgba(79, 172, 254, 0.2);
      color: #4facfe;
    }

    .action-btn.delete {
      background: rgba(245, 87, 108, 0.2);
      color: #f5576c;
    }

    .action-btn:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Login View -->
  <div id="login-view" class="login-container">
    <div class="login-card glass-card glass-card-lg fade-in">
      <div class="text-center">
        <div style="width: 80px; height: 80px; background: var(--gradient-primary); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 1.5rem;">🔐</div>
        <h2>Admin Login</h2>
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">
          Access the admin dashboard
        </p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="username" class="form-input" placeholder="Enter username" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
          Login
        </button>
      </form>

      <div class="text-center" style="margin-top: 2rem;">
        <a href="/" style="color: var(--text-muted); text-decoration: none;">← Back to Home</a>
      </div>
    </div>
  </div>

  <!-- Dashboard View -->
  <div id="dashboard-view" class="hidden">
    <!-- Header -->
    <header style="padding: 1.5rem; background: var(--glass-bg-primary); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border);">
      <div class="container" style="max-width: 1400px; display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <div style="width: 40px; height: 40px; background: var(--gradient-primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;">🎯</div>
          <span style="font-weight: 700; font-size: 1.2rem;">SkillZen AI Admin</span>
        </div>
        <div style="display: flex; gap: 1rem; align-items: center;">
          <span style="color: var(--text-muted);" id="admin-username"></span>
          <button class="btn btn-glass" id="logout-btn" style="padding: 0.5rem 1.5rem;">Logout</button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="admin-container">
      <!-- Statistics -->
      <div class="dashboard-grid fade-in">
        <div class="stat-card glass-gradient-purple">
          <div style="font-size: 2rem;">📊</div>
          <div class="stat-number" id="total-companies">0</div>
          <div style="color: var(--text-secondary);">Total Companies</div>
        </div>

        <div class="stat-card glass-gradient-pink">
          <div style="font-size: 2rem;">✅</div>
          <div class="stat-number" id="active-companies">0</div>
          <div style="color: var(--text-secondary);">Active Companies</div>
        </div>

        <div class="stat-card glass-gradient-blue">
          <div style="font-size: 2rem;">🎓</div>
          <div class="stat-number" id="vtu-approved">0</div>
          <div style="color: var(--text-secondary);">VTU Approved</div>
        </div>
      </div>

      <!-- Actions -->
      <div style="margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center;">
        <h2>Company Management</h2>
        <button class="btn btn-primary" id="add-company-btn">
          ➕ Add New Company
        </button>
      </div>

      <!-- Companies Table -->
      <div class="glass-card" style="overflow-x: auto;">
        <table class="company-table">
          <thead>
            <tr>
              <th>Company Name</th>
              <th>Location</th>
              <th>Min CGPA</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="companies-tbody">
            <tr>
              <td colspan="5" class="text-center" style="padding: 3rem;">
                <div class="spinner" style="margin: 0 auto;"></div>
                <div style="margin-top: 1rem; color: var(--text-muted);">Loading companies...</div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Add/Edit Company Modal -->
  <div id="company-modal" class="modal hidden">
    <div class="modal-content">
      <h3 id="modal-title">Add New Company</h3>
      <form id="company-form">
        <div class="form-group">
          <label class="form-label">Company Name *</label>
          <input type="text" id="company-name" class="form-input" required>
        </div>

        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea id="company-description" class="form-input" rows="3" style="resize: vertical;"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Location</label>
          <input type="text" id="company-location" class="form-input" placeholder="e.g., Bangalore, Karnataka">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" id="company-email" class="form-input">
          </div>

          <div class="form-group">
            <label class="form-label">Phone</label>
            <input type="text" id="company-phone" class="form-input">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Website</label>
          <input type="url" id="company-website" class="form-input">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label">Min CGPA</label>
            <input type="number" id="company-min-cgpa" class="form-input" min="0" max="10" step="0.1" value="6.0">
          </div>

          <div class="form-group">
            <label class="form-label">Min SGPA</label>
            <input type="number" id="company-min-sgpa" class="form-input" min="0" max="10" step="0.1" value="6.0">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Technical Skills (comma-separated)</label>
          <textarea id="company-tech-skills" class="form-input" rows="2" placeholder="Python, Java, React, AWS"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Programming Languages (comma-separated)</label>
          <textarea id="company-languages" class="form-input" rows="2" placeholder="Python, Java, JavaScript"></textarea>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
          <button type="button" class="btn btn-glass" id="cancel-modal-btn" style="flex: 1;">Cancel</button>
          <button type="submit" class="btn btn-primary" style="flex: 1;">Save Company</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>

  <script>
    // Admin Panel Logic
    class AdminPanel {
      constructor() {
        this.currentCompanyId = null;
        this.companies = [];
        this.init();
      }

      async init() {
        // Check if already logged in
        const auth = await window.api.checkAuth();
        if (auth.authenticated) {
          this.showDashboard(auth.admin);
        }

        // Setup event listeners
        this.setupEventListeners();
      }

      setupEventListeners() {
        // Login form
        document.getElementById('login-form').addEventListener('submit', (e) => {
          e.preventDefault();
          this.handleLogin();
        });

        // Logout
        document.getElementById('logout-btn')?.addEventListener('click', () => {
          this.handleLogout();
        });

        // Add company
        document.getElementById('add-company-btn')?.addEventListener('click', () => {
          this.showCompanyModal();
        });

        // Cancel modal
        document.getElementById('cancel-modal-btn').addEventListener('click', () => {
          this.hideCompanyModal();
        });

        // Company form
        document.getElementById('company-form').addEventListener('submit', (e) => {
          e.preventDefault();
          this.saveCompany();
        });
      }

      async handleLogin() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
          const response = await window.api.login(username, password);
          this.showDashboard(response.admin);
          this.showNotification('Login successful!', 'success');
        } catch (error) {
          this.showNotification('Invalid credentials', 'error');
        }
      }

      async handleLogout() {
        try {
          await window.api.logout();
          document.getElementById('dashboard-view').classList.add('hidden');
          document.getElementById('login-view').classList.remove('hidden');
          this.showNotification('Logged out successfully', 'success');
        } catch (error) {
          console.error('Logout error:', error);
        }
      }

      async showDashboard(admin) {
        document.getElementById('login-view').classList.add('hidden');
        document.getElementById('dashboard-view').classList.remove('hidden');
        document.getElementById('admin-username').textContent = admin.username;

        await this.loadCompanies();
      }

      async loadCompanies() {
        try {
          const response = await window.api.getCompanies();
          this.companies = response.companies;
          
          // Update stats
          document.getElementById('total-companies').textContent = this.companies.length;
          document.getElementById('active-companies').textContent = this.companies.filter(c => c.is_active).length;
          document.getElementById('vtu-approved').textContent = this.companies.filter(c => c.vtu_approved).length;

          // Render table
          this.renderCompaniesTable();
        } catch (error) {
          console.error('Failed to load companies:', error);
        }
      }

      renderCompaniesTable() {
        const tbody = document.getElementById('companies-tbody');
        
        if (this.companies.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center" style="padding: 3rem; color: var(--text-muted);">No companies found</td></tr>';
          return;
        }

        tbody.innerHTML = this.companies.map(company => `
          <tr>
            <td style="font-weight: 600;">${company.name}</td>
            <td>${company.location || 'N/A'}</td>
            <td>${company.min_cgpa}</td>
            <td>
              <span style="padding: 0.25rem 0.75rem; border-radius: 12px; font-size: 0.85rem; background: ${company.is_active ? 'rgba(79, 172, 254, 0.2)' : 'rgba(245, 87, 108, 0.2)'}; color: ${company.is_active ? '#4facfe' : '#f5576c'};">
                ${company.is_active ? 'Active' : 'Inactive'}
              </span>
            </td>
            <td>
              <button class="action-btn edit" onclick="adminPanel.editCompany(${company.id})">Edit</button>
              <button class="action-btn delete" onclick="adminPanel.deleteCompany(${company.id})">Delete</button>
            </td>
          </tr>
        `).join('');
      }

      showCompanyModal(company = null) {
        this.currentCompanyId = company?.id || null;
        document.getElementById('modal-title').textContent = company ? 'Edit Company' : 'Add New Company';
        
        if (company) {
          document.getElementById('company-name').value = company.name;
          document.getElementById('company-description').value = company.description || '';
          document.getElementById('company-location').value = company.location || '';
          document.getElementById('company-email').value = company.email || '';
          document.getElementById('company-phone').value = company.phone || '';
          document.getElementById('company-website').value = company.website || '';
          document.getElementById('company-min-cgpa').value = company.min_cgpa;
          document.getElementById('company-min-sgpa').value = company.min_sgpa;
          document.getElementById('company-tech-skills').value = company.technical_skills.join(', ');
          document.getElementById('company-languages').value = company.programming_languages.join(', ');
        } else {
          document.getElementById('company-form').reset();
        }

        document.getElementById('company-modal').classList.remove('hidden');
      }

      hideCompanyModal() {
        document.getElementById('company-modal').classList.add('hidden');
        this.currentCompanyId = null;
      }

      async saveCompany() {
        const data = {
          name: document.getElementById('company-name').value,
          description: document.getElementById('company-description').value,
          location: document.getElementById('company-location').value,
          email: document.getElementById('company-email').value,
          phone: document.getElementById('company-phone').value,
          website: document.getElementById('company-website').value,
          min_cgpa: parseFloat(document.getElementById('company-min-cgpa').value),
          min_sgpa: parseFloat(document.getElementById('company-min-sgpa').value),
          technical_skills: document.getElementById('company-tech-skills').value.split(',').map(s => s.trim()).filter(Boolean),
          programming_languages: document.getElementById('company-languages').value.split(',').map(s => s.trim()).filter(Boolean),
        };

        try {
          if (this.currentCompanyId) {
            await window.api.updateCompany(this.currentCompanyId, data);
            this.showNotification('Company updated successfully!', 'success');
          } else {
            await window.api.addCompany(data);
            this.showNotification('Company added successfully!', 'success');
          }
          
          this.hideCompanyModal();
          await this.loadCompanies();
        } catch (error) {
          this.showNotification('Failed to save company', 'error');
        }
      }

      editCompany(id) {
        const company = this.companies.find(c => c.id === id);
        if (company) {
          this.showCompanyModal(company);
        }
      }

      async deleteCompany(id) {
        if (!confirm('Are you sure you want to delete this company?')) {
          return;
        }

        try {
          await window.api.deleteCompany(id);
          this.showNotification('Company deleted successfully!', 'success');
          await this.loadCompanies();
        } catch (error) {
          this.showNotification('Failed to delete company', 'error');
        }
      }

      showNotification(message, type = 'info') {
        const notification = document.createElement('div');
        notification.className = 'slide-in-down';
        notification.style.cssText = `
          position: fixed;
          top: 2rem;
          right: 2rem;
          padding: 1rem 2rem;
          background: var(--glass-bg-primary);
          backdrop-filter: blur(20px);
          border: 1px solid var(--glass-border);
          border-radius: 12px;
          box-shadow: var(--shadow-lg);
          z-index: 10000;
          max-width: 400px;
        `;
        
        const color = type === 'error' ? '#f5576c' : type === 'success' ? '#4facfe' : '#f093fb';
        notification.style.borderLeft = `4px solid ${color}`;
        notification.textContent = message;
        
        document.body.appendChild(notification);
        
        setTimeout(() => {
          notification.classList.add('fade-out');
          setTimeout(() => notification.remove(), 500);
        }, 3000);
      }
    }

    // Initialize admin panel
    const adminPanel = new AdminPanel();
    window.adminPanel = adminPanel;
  </script>
</body>
</html>
